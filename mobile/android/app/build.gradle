plugins {
    id 'com.android.application'
}

def motoristaUrl = project.findProperty('motoristaUrl') ?: 'https://profissional.dotas.site/'
def transportadoraUrl = project.findProperty('transportadoraUrl') ?: 'https://empresa.dotas.site/'

android {
    namespace 'br.com.zapencomendas.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.zapencomendas.mobile'
        buildConfigField 'String', 'API_URL', '"https://api.dotas.site"'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }

    flavorDimensions += ['perfil']
    productFlavors {
        motorista {
            dimension 'perfil'
            applicationId 'br.com.zapencomendas.motorista'
            versionCode 19
            versionName '0.19.0'
            resValue 'string', 'app_name', 'EncomendasZap Motorista'
            buildConfigField 'String', 'WEB_URL', '"' + motoristaUrl + '"'
        }
        transportadora {
            dimension 'perfil'
            versionCode 11
            versionName '0.11.0'
            applicationId 'br.com.zapencomendas.transportadora'
            resValue 'string', 'app_name', 'EncomendasZap Transportadora'
            buildConfigField 'String', 'WEB_URL', '"' + transportadoraUrl + '"'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation('io.socket:socket.io-client:2.1.2') { exclude group: 'org.json', module: 'json' }
}

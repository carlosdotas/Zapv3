<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta charset="utf-8"><style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#e7e8e3;font:14px sans-serif}#map{position:relative}img,.route,.point,.label{position:absolute}.route{inset:0;pointer-events:none}.point{transform:translate(-50%,-50%);width:18px;height:18px;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px #3338}.driver{background:#1a73e8}.driver:after{content:'Você';position:absolute;left:50%;top:24px;transform:translateX(-50%);background:#fff;color:#0b5187;border-radius:7px;padding:3px 6px;font-size:11px;font-weight:bold}.pickup{width:44px;height:44px;transform:translate(-50%,-100%);border:3px solid white;border-radius:12px;background:#ff5e00;display:grid;place-items:center;color:white;box-shadow:0 3px 9px #002b4966}.pickup:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#ff5e00}.pickup svg{width:31px;height:31px}.pickup-name{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;color:#002b49;padding:5px 9px;border:1px solid #0b5187;border-radius:8px;font-size:12px;font-weight:bold}.label{transform:translate(-50%,-50%);background:#0b5187;color:white;padding:6px 10px;border:2px solid white;border-radius:20px;font-weight:bold;white-space:nowrap}.notice{position:absolute;left:10px;right:10px;top:110px;text-align:center;background:#fffffff0;color:#334155;border-radius:10px;padding:8px}.credit{position:absolute;bottom:0;right:0;background:#fff;color:#334155;font-size:10px}
</style></head><body><div id="map"><div id="notice" class="notice">Buscando rota…</div><span class="credit">© colaboradores do OpenStreetMap</span></div><script>
const params=new URLSearchParams(location.search), number=key=>params.has(key)?Number(params.get(key)):NaN;
const origin=[number('olat'),number('olon')], destination=[number('dlat'),number('dlon')];
const valid=p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&Math.abs(p[0])<=85&&Math.abs(p[1])<=180;
const map=document.getElementById('map'), notice=document.getElementById('notice');
let lastPoints=[],lastDistance=0;
function project(p,z){const n=256*2**z, sin=Math.sin(p[0]*Math.PI/180);return [(p[1]+180)/360*n,(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n]}
function render(points,distance){
  lastPoints=points;lastDistance=distance;
  const w=map.clientWidth,h=map.clientHeight,both=valid(origin)&&valid(destination),anchor=valid(origin)?origin:valid(destination)?destination:[-14.235,-51.9253];let z=both?15:(valid(origin)||valid(destination))?14:4;
  if(!w||!h)return;
  const top=Math.min(120,h*.2),bottom=Math.min(300,h*.45),safeHeight=Math.max(80,h-top-bottom),viewY=top+safeHeight/2;
  if(both)for(;z>3;z--){const a=project(origin,z),b=project(destination,z);if(Math.abs(a[0]-b[0])<w*.65&&Math.abs(a[1]-b[1])<safeHeight*.65)break}
  const a=project(both?origin:anchor,z),b=project(both?destination:anchor,z),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,n=2**z;
  map.querySelectorAll('.tile,.route,.point,.label').forEach(e=>e.remove());
  for(let y=Math.max(0,Math.floor((cy-viewY)/256));y<=Math.min(n-1,Math.floor((cy+h-viewY)/256));y++)for(let x=Math.floor((cx-w/2)/256);x<=Math.floor((cx+w/2)/256);x++){const img=document.createElement('img');img.className='tile';img.width=256;img.height=256;img.alt='';img.style.left=(x*256-cx+w/2)+'px';img.style.top=(y*256-cy+viewY)+'px';img.src=`https://tile.openstreetmap.org/${z}/${((x%n)+n)%n}/${y}.png`;map.insertBefore(img,notice)}
  const xy=p=>{const q=project(p,z);return [q[0]-cx+w/2,q[1]-cy+viewY]};
  if(points.length){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('route');svg.setAttribute('width',w);svg.setAttribute('height',h);const coords=points.map(xy),line=coords.map(p=>p.join(',')).join(' ');for(const [stroke,width] of [['white',9],['#1675d1',5]]){const poly=document.createElementNS(svg.namespaceURI,'polyline');poly.setAttribute('points',line);poly.setAttribute('fill','none');poly.setAttribute('stroke',stroke);poly.setAttribute('stroke-width',width);poly.setAttribute('stroke-linecap','round');poly.setAttribute('stroke-linejoin','round');svg.appendChild(poly)}map.insertBefore(svg,notice);const lengths=coords.slice(1).map((p,i)=>Math.hypot(p[0]-coords[i][0],p[1]-coords[i][1])),half=lengths.reduce((a,b)=>a+b,0)/2;let walked=0,mid=coords[0];for(let i=0;i<lengths.length;i++){if(walked+lengths[i]>=half&&lengths[i]>0){const t=(half-walked)/lengths[i];mid=[coords[i][0]+(coords[i+1][0]-coords[i][0])*t,coords[i][1]+(coords[i+1][1]-coords[i][1])*t];break}walked+=lengths[i]}const label=document.createElement('span');label.className='label';label.style.left=mid[0]+'px';label.style.top=mid[1]+'px';label.textContent=distance<1000?`${Math.round(distance)} m`:`${(distance/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})} km`;map.insertBefore(label,notice)}
  for(const [p,kind] of [[origin,'driver'],[destination,'pickup']]){if(!valid(p))continue;const q=xy(p),el=document.createElement('span');el.className='point '+kind;el.style.left=q[0]+'px';el.style.top=q[1]+'px';if(kind==='pickup'){const name=document.createElement('span');name.className='pickup-name';name.textContent=params.get('pickupName')||'Local de coleta';el.appendChild(name);const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.innerHTML='<path d="m12 3 9 5v8l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v8" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>';el.appendChild(icon)}map.insertBefore(el,notice)}
}
window.addEventListener('resize',()=>render(lastPoints,lastDistance));
if(!valid(origin)||!valid(destination)){render([],0);notice.textContent=!valid(destination)?'A transportadora não informou a localização da coleta.':'Aguardando a localização do motorista.'}else{
  render([],0);
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
  fetch(`https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`,{signal:controller.signal}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const r=data.routes?.[0],coords=r?.geometry?.coordinates;if(data.code!=='Ok'||!Number.isFinite(r?.distance)||!Array.isArray(coords)||coords.length<2)throw Error();const points=coords.map(p=>[p[1],p[0]]);if(!points.every(valid))throw Error();render(points,r.distance);notice.style.display='none'}).catch(()=>{notice.textContent='Não foi possível carregar a rota.'}).finally(()=>clearTimeout(timeout));
}
</script></body></html>
